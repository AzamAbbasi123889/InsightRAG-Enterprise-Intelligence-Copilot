services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insightrag
      POSTGRES_USER: insightrag
      POSTGRES_PASSWORD: insightrag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/data/seed.sql:/docker-entrypoint-initdb.d/001_seed.sql:ro

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://insightrag:insightrag@postgres:5432/insightrag
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      - postgres
      - neo4j
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  neo4j_data:
